name: Deploy to Production

on:
  pull_request:
    types: [closed]
    branches:
      - production

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start MySQL service
        run: |
          sudo systemctl start mysql
          mysql -u root -proot -e "CREATE DATABASE IF NOT EXISTS arcm_test;"

      - name: Run tests
        run: |
          npm run test:e2e
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: arcm_test
          JWT_SECRET: test-jwt-secret-for-e2e-tests
          JWT_REFRESH_SECRET: test-refresh-secret-for-e2e-tests
          NODE_ENV: test
          NODE_OPTIONS: --experimental-vm-modules

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          chmod 700 ~/.ssh

      - name: Deploy
        run: |
          bash scripts/deploy-production.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_SERVER }} \
            ~/.ssh/id_ed25519
        env:
          APP_NAME: server
          DEPLOY_DIR: /app/server
          SG_ID: ${{ secrets.EC2_SG_ID }}
